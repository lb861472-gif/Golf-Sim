name: Build iOS App

on:
push:
branches: [ "main", "master" ]
workflow_dispatch:

jobs:
build:
runs-on: macos-latest
steps:
- uses: actions/checkout@v4
- name: Select Xcode
run: sudo xcode-select -s /Applications/Xcode_15.2.app
- name: Build app
run: xcodebuild -project GolfSim.xcodeproj -scheme GolfSim -sdk iphonesimulator -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
- name: Package IPA
run: |
mkdir -p Payload
APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "GolfSim.app" -type d | head -n 1)
cp -r "$APP_PATH" Payload/
zip -r GolfSim-unsigned.ipa Payload
rm -rf Payload
- name: Upload artifact
uses: actions/upload-artifact@v4
with:
name: GolfSim-unsigned-ipa
path: GolfSim-unsigned.ipa

workflows:
ios-build:
name: GolfSim iOS Build
max_build_duration: 60
instance_type: mac_mini_m2

environment:
xcode: latest

scripts:
- name: Build GolfSim IPA
script: |
xcode-project build-ipa \
--project "$CM_BUILD_DIR/GolfSim.xcodeproj" \
--scheme "GolfSim"

artifacts:
- build/ios/ipa/*.ipa
- /tmp/xcodebuild_logs/*.log
